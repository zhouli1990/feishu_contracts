version: 1
join:
  keys:
    group_id:
      details: group_id
      form: group_id
      payment_plan_list: group_id
      contract_budget_list: group_id
      our_party_list: group_id
      counter_party_list: group_id

# 目标模板各 Sheet 的映射

target_sheets:
  - name: 历史合同导入
    row_key: group_id
    row_policy: one_to_one
    source: details
    mappings:
      - to: { column: 合同编码 }
        from: 
          - { sheet: details, column: contract_number }
          - { sheet: details, column: group_id }
        transform: [trim]
        required: true
        fallback_mode: first_non_empty
      - to: { column: 飞书合同id }
        from: 
          - { sheet: details, column: contract_id }
        transform: [trim]
        required: true
      - to: { column: 合同流水号 }
        from: [{ sheet: details, column: group_id }]
        transform: [trim]
      - to: { column: 合同状态 }
        from: [{ sheet: details, column: contract_status_code }]
        transform: 
         - { dict: { table: 合同状态, default: "" } }
      - to: { column: 合同名称 }
        from: [{ sheet: details, column: contract_name }]
        transform: [trim]
        required: true
      - to: { column: 签订部门 }
        default: "D001"
      - to: { column: 业务归属部门 }
        default: "D001"
      - to: { column: 负责人 }
        default: "0001"
      - to: { column: 收支类型 }
        from: [{ sheet: details, column: pay_type_name }]
        transform: [trim]
      - to: { column: 合同分类 }
        from: [{ sheet: details, column: contract_category_name }]
        transform: [trim]
      - to: { column: 合同说明 }
        from: [{ sheet: details, column: remark }]
        transform: [trim]
      - to: { column: 计价方式 }
        from: [{ sheet: details, column: property_type_name }]
        transform: 
          - dict: { table: 计价方式, default: "" }
      - to: { column: 合同性质 }
        default: "单次合同"
      - to: { column: 合同总额（含税） }
        from: [{ sheet: details, column: amount }]
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 4
      - to: { column: 预估金额（含税） }
        from: [{ sheet: details, column: estimated_amount }]
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 4
      - to: { column: 币种 }
        from: [{ sheet: details, column: currency_name }]
        transform:
          - { dict: { table: 币种, default: "" } }
      - to: { column: 预估金额币种 }
        from: [{ sheet: details, column: currency_name }]
        transform:
          - { dict: { table: 币种, default: "" } }
      - to: { column: 合同期限类型 }
        from: [{ sheet: details, column: fixed_validity_name }]
        transform: 
          - dict: { table: 合同期限类型, default: "" }
      - to: { column: 合同期限说明 }
        from: [{ sheet: details, column: validity_date_desc }]
        transform: [trim]
      - to: { column: 有效日期从 }
        from: [{ sheet: details, column: start_date }]
        transform:
          - date_parse: { input_formats: ["yyyy-MM-dd", "yyyy/M/d", "yyyy/M/dd"], tz: "Asia/Shanghai" }
          - date_format: "yyyy-MM-dd"
      - to: { column: 有效日期至 }
        from: [{ sheet: details, column: end_date }]
        transform:
          - date_parse: { input_formats: ["yyyy-MM-dd", "yyyy/M/d", "yyyy/M/dd"], tz: "Asia/Shanghai" }
          - date_format: "yyyy-MM-dd"
      - to: { column: 创建时间 }
        from:
          - { sheet: details, column: create_time }
          # - { sheet: form, column: attribute_value }
        # where_list:
          # - {}  # 第一个源没有 where 条件，使用空对象占位
          # - { attribute_name: "L创建时间" }
        transform:
          - date_parse: { input_formats: ["yyyy-MM-dd HH:mm:ss", "yyyy/M/d H:mm", "yyyy-MM-dd"], tz: "Asia/Shanghai" }
          - date_format: "yyyy-MM-dd HH:mm:ss"
        # fallback_mode: first_non_empty
      - to: { column: 合同签订时间 }
        from: [{ sheet: details, column: signed_time }]
        transform:
          - date_parse: { input_formats: ["yyyy-MM-dd HH:mm:ss", "yyyy/M/d H:mm", "yyyy-MM-dd"], tz: "Asia/Shanghai" }
          - date_format: "yyyy-MM-dd HH:mm:ss"
      - to: { column: 合同归档时间 }
        from: [{ sheet: details, column: archived_time }]
        transform:
          - date_parse: { input_formats: ["yyyy-MM-dd HH:mm:ss", "yyyy/M/d H:mm", "yyyy-MM-dd"], tz: "Asia/Shanghai" }
          - date_format: "yyyy-MM-dd HH:mm:ss"
      - to: { column: 合同创建人飞书user_id }
        from: [{ sheet: details, column: create_user_id }]
        transform: [trim]
      - to: { column: 合同创建人姓名 }
        from: [{ sheet: details, column: create_user_name }]
        transform: [trim]
      - to: { column: 终止日期类型 }
        from: [{ sheet: details, column: termination_date_type_code }]
        transform: 
          - dict: { table: 终止日期类型编码, default: "" }
      - to: { column: 终止日期 }
        from: [{ sheet: details, column: termination_date }]
        transform:
          - date_parse: { input_formats: ["yyyy-MM-dd HH:mm:ss", "yyyy/M/d H:mm", "yyyy-MM-dd"], tz: "Asia/Shanghai" }
          - date_format: "yyyy-MM-dd HH:mm:ss"
      - to: { column: 终止原因 }
        from: [{ sheet: details, column: termination_remark }]
        transform: [trim]

      # form 长表字段：按 attribute_name 过滤，取 attribute_value（支持历史字段回退）
      - to: { column: 需求人 }
        from:
          - { sheet: form, column: attribute_value }
          - { sheet: form, column: attribute_value }
        where_list:
          - { attribute_name: "需求人" }
          - { attribute_name: "L需求人" }
        transform:
          - json_parse: {}
          - form_pick: { field_pairs: [name, user_id], unique: true }
          - to_value_label:
              value_field: user_id
              label_field: name
              value_dict: 员工映射
              keep_original: false
              default: ""
          - json_stringify: { empty:  }
        fallback_mode: first_non_empty
        
      - to: { column: 需求人部门 }
        from:
          - { sheet: form, column: attribute_value }
          - { sheet: form, column: attribute_value }
        where_list:
          - { attribute_name: "需求人部门" }
          - { attribute_name: "L需求人部门" }
        transform:
          - json_parse: {}
          - form_pick: { field_pairs: [name, lark_department_id], unique: true }
          - to_value_label:
              value_field: lark_department_id
              label_field: name
              value_dict: 部门映射
              keep_original: false
              default: ""
          - json_stringify: { empty:  }
        fallback_mode: first_non_empty

      - to: { column: 履约保证金 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "履约保证金" }
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 2
      - to: { column: 质保金 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "质保金" }
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 2
      - to: { column: 产品名称 }
        from:
          - { sheet: form, column: attribute_value }
          - { sheet: form, column: attribute_value }
        where_list:
          - { attribute_name: "项目" }
          - { attribute_name: "L项目" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
        fallback_mode: first_non_empty
      
      - to: { column: 知识产权归属 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "知识产权归属" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
      
      - to: { column: 是否对外披露我方信息 }
        from:
          - { sheet: form, column: attribute_value }
          - { sheet: form, column: attribute_value }
        where_list:
          - { attribute_name: "是否对外披露我方信息" }
          - { attribute_name: "L是否对外披露我方信息" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
        fallback_mode: first_non_empty
      
      - to: { column: 是否有保函 }
        from:
          - { sheet: form, column: attribute_value }
          - { sheet: form, column: attribute_value }
        where_list:
          - { attribute_name: "是否有保函" }
          - { attribute_name: "L是否有保函" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
        fallback_mode: first_non_empty
      - to: { column: 样件采购申请单号 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "样件采购申请单号" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
      - to: { column: 来源系统业务类型 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "来源系统业务类型" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
      - to: { column: 来源系统名称 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "来源系统名称" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
      - to: { column: 来源系统单号 }
        from:
          - { sheet: details, column: source_id }
          - { sheet: form, column: attribute_value }
        where_list:
          - {}  # 第一个源没有 where 条件，使用空对象占位
          - { attribute_name: "来源系统单号" }
        transform:
          - json_parse: {}
          - form_pick: { field: content }
        fallback_mode: first_non_empty
      - to: { column: 门店名称 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "门店名称" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
      - to: { column: 承租地址 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "承租地址" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
      - to: { column: 租赁面积 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "租赁面积" }
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 2
      - to: { column: PEA审批记录 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "PEA审批记录" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
      - to: { column: 是否为单方NDA }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "是否为单方NDA" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
      - to: { column: L对方主体 }
        from: [{ sheet: form, column: attribute_value }]
        where: { attribute_name: "L对方主体" }

  - name: 付款计划
    row_key: uuid
    row_policy: one_to_many
    source: payment_plan_list
    mappings:
      - to: { column: 合同编码 }
        from:
          - { sheet: payment_plan_list, column: contract_number }
          - { sheet: payment_plan_list, column: group_id }
        transform: [trim]
        fallback_mode: first_non_empty
      - to: { column: uuid }
        from: [{ sheet: payment_plan_list, column: uuid }]
      - to: { column: 付款时间 }
        from: [{ sheet: payment_plan_list, column: payment_date }]
        transform:
          - date_parse: { input_formats: ["yyyy-MM-dd", "yyyy/M/d", "yyyy-MM-dd HH:mm:ss"], tz: "Asia/Shanghai" }
          - date_format: "yyyy-MM-dd"
      - to: { column: 付款条件 }
        from: [{ sheet: payment_plan_list, column: payment_condition }]
        transform: [trim]
      - to: { column: 付款金额 }
        from: [{ sheet: payment_plan_list, column: payment_amount }]
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 2
      - to: { column: 是否预付 }
        from: [{ sheet: payment_plan_list, column: prepaid }]
        transform: 
          - { dict: { table: 是否预付, default: "" } }
      - to: { column: 付款对象 }
        from: [{ sheet: payment_plan_list, column: payment_counter_party }]
        transform:
          - json_parse: {}
          - form_pick: { field: counter_party_code }
      - to: { column: 付款说明 }
        from: [{ sheet: payment_plan_list, column: payment_desc }]
        transform: [trim]
      - to: { column: 付款比例（%） }
        from: [{ sheet: payment_plan_list, column: payment_rate }]
        transform: [number_parse]
      - to: { column: 是否需要验收 }
        from: [{ sheet: payment_plan_list, column: need_check }]
        transform:
          - { dict: { table: 是否需要验收, default: "" } }

  - name: 预算明细
    row_key: uuid
    row_policy: one_to_many
    source: contract_budget_list
    mappings:
      - to: { column: 合同编码 }
        from:
          - { sheet: contract_budget_list, column: contract_number }
          - { sheet: contract_budget_list, column: group_id }
        transform: [trim]
        fallback_mode: first_non_empty
      - to: { column: uuid }
        from: [{ sheet: contract_budget_list, column: uuid }]
      - to: { column: 预算年度 }
        from: [{ sheet: contract_budget_list, column: budget_year }]
        transform: [number_parse]
      - to: { column: 预算部门 }
        from: [{ sheet: contract_budget_list, column: budget_department_info }]
        transform:
          - json_parse: {}
          - form_pick: { field: source_id }
      - to: { column: 预算部门（占位） }
        from: [{ sheet: contract_budget_list, column: budget_department_name }]
        transform: [trim]
      - to: { column: 成本中心组编码 }
        from: [{ sheet: contract_budget_list, column: cost_center_group_code }]
        transform: [trim]
      - to: { column: 成本中心组名称 }
        from: [{ sheet: contract_budget_list, column: cost_center_group_name }]
        transform: [trim]
      - to: { column: 会计科目 }
        from: [{ sheet: contract_budget_list, column: budget_chart_of_account_code }]
        transform: [trim]
      - to: { column: 会计科目（占位） }
        from: [{ sheet: contract_budget_list, column: budget_chart_of_account_name }]
        transform: [trim]
      - to: { column: 业务场景 }
        from: [{ sheet: contract_budget_list, column: budget_business_scene_code }]
        transform: [trim]
      - to: { column: 业务场景（占位） }
        from: [{ sheet: contract_budget_list, column: budget_business_scene_name }]
        transform: [trim]
      - to: { column: 项目 }
        from: [{ sheet: contract_budget_list, column: budget_project_code }]
        transform: [trim]
      - to: { column: 项目（占位） }
        from: [{ sheet: contract_budget_list, column: budget_project_name }]
        transform: [trim]
      - to: { column: 产品 }
        from: [{ sheet: contract_budget_list, column: budget_product_code }]
        transform: [trim]
      - to: { column: 产品（占位） }
        from: [{ sheet: contract_budget_list, column: budget_product_name }]
        transform: [trim]
      - to: { column: 金额（含税） }
        from: [{ sheet: contract_budget_list, column: budget_taxed_amount }]
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 2
      - to: { column: 金额（不含税） }
        from: [{ sheet: contract_budget_list, column: budget_occupied_amount }]
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 2
      - to: { column: 税率（%） }
        from: [{ sheet: contract_budget_list, column: tax_rate }]
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 2
          - dict: { table: 税率字典, default: "" }
      - to: { column: 税额 }
        from: [{ sheet: contract_budget_list, column: tax_amount }]
        transform:
          - number_parse: { thousands: ",", decimal: "." }
          - round: 2
      

  - name: 签约信息拟制表单
    row_key: contract_number
    row_policy: one_to_one
    source: form
    mappings:
      - to: { column: 合同编码 }
        from: 
          - { sheet: form, column: contract_number }
          - { sheet: form, column: group_id }
        transform: [trim]
        fallback_mode: first_non_empty
      - to: { column: 飞书合同id }
        from: 
          - { sheet: details, column: contract_id }
        transform: [trim]
      - to: { column: 是否我方先盖章 }
        from: 
          - { sheet: form, column: attribute_value }
          - { sheet: form, column: attribute_value }
        where_list: 
          - { attribute_name: "是否我方先盖章" }
          - { attribute_name: "L是否我方先盖章" }
        transform:
          - json_parse: {}
          - form_pick: { field: name }
          - dict: { table: 是否我方先盖章, default: "" }
        fallback_mode: first_non_empty
      - to: { column: 签约方式 }
        default: "纸质签约"

  - name: 签约方
    row_key: contract_number
    row_policy: one_to_one
    source: form
    mappings:
      - to: { column: 合同编码 }
        from: 
          - { sheet: form, column: contract_number }
          - { sheet: form, column: group_id }
        transform: [trim]
        fallback_mode: first_non_empty

      - to: { column: 盖章种类 }
        default: "合同专用章"

      - to: { column: 签约方式 }
        default: "纸质签约"

  # 相对方：我方与对方两份源表，分别追加写入同一目标Sheet
  ## 我方
  - name: 合同关联相对方（通用）
    append: true
    row_key: our_party_id
    row_policy: one_to_many
    source: our_party_list
    mappings:
      - to: { column: 合同编码 }
        from: 
          - { sheet: our_party_list, column: contract_number }
          - { sheet: our_party_list, column: group_id }
        transform: [trim]
        fallback_mode: first_non_empty
      - to: { column: 交易方名称 }
        from: [{ sheet: our_party_list, column: our_party_name }]
        transform: [trim]
      - to: { column: 是否我方 }
        default: "是"
      - to: { column: 交易方角色 }
        default: "我方"
      - to: { column: 是否盖章或签字 }
        default: "1"
      - to: { column: 是否为主签约方 }
        default: "是"
      - to: { column: 交易方编码 }
        from: [{ sheet: our_party_list, column: our_party_code }]
        transform: [trim]
      - to: { column: 纳税人识别号 }
        from: [{ sheet: our_party_list, column: certification_id }]
        transform: [trim]
  ## 对方
  # - name: 合同关联相对方（通用）
  #   append: true
  #   row_key: group_id
  #   row_policy: one_to_one
  #   source: form
  #   mappings:
  #     - to: { column: 合同编码 }
  #       from: 
  #         - { sheet: form, column: contract_number }
  #         - { sheet: form, column: group_id }
  #       transform: [trim]
  #       fallback_mode: first_non_empty
  #     - to: { column: 交易方名称 }
  #       from: [{ sheet: form, column: attribute_value }]
  #       where: { attribute_name: "L对方主体" }
  #       transform: 
  #     - to: { column: 是否我方 }
  #       default: "是"
  #     - to: { column: 交易方角色 }
  #       default: "对方"
  #     - to: { column: 是否盖章或签字 }
  #       default: "1"
  #     - to: { column: 是否为主签约方 }
  #       default: "是"
  - name: 合同关联相对方（通用）
    append: true
    row_key: counter_party_id
    row_policy: one_to_many
    source: counter_party_list
    mappings:
      - to: { column: 合同编码 }
        from:
          - { sheet: counter_party_list, column: contract_number }
          - { sheet: counter_party_list, column: group_id }
        transform: [trim]
        fallback_mode: first_non_empty
      - to: { column: 交易方名称 }
        from: [{ sheet: counter_party_list, column: counter_party_name }]
        transform: [trim]
      - to: { column: 是否我方 }
        default: "否"
      - to: { column: 交易方角色 }
        default: "对方"
      - to: { column: 是否盖章或签字 }
        default: "1"
      - to: { column: 是否为主签约方 }
        default: "是"
      - to: { column: 交易方编码 }
        from: [{ sheet: counter_party_list, column: counter_party_code }]
        transform: [trim]
      - to: { column: 纳税人识别号 }
        from: [{ sheet: counter_party_list, column: certification_id }]
        transform: [trim]

  - name: 合同关联信息
    append: true
    row_key: relation_key
    row_policy: one_to_many
    source:  relation_contracts_contracts
    mappings:
      - to: { column: 合同编码 }
        from: 
          - { sheet: relation_contracts_contracts, column: contract_number }
          - { sheet: relation_contracts_contracts, column: group_id }
        transform: [trim]
        fallback_mode: first_non_empty
      - to: { column: 关联合同编号 }
        from: [{ sheet: relation_contracts_contracts, column: related_contract_number }]
        transform: [trim]
      - to: { column: 关联合同名称 }
        from: [{ sheet: relation_contracts_contracts, column: related_contract_name }]
        transform: [trim]

dict:
  合同状态:
    9: 已归档
    10: 已归档
    11: 已归档
    16: 已归档
    17: 已终止
    0: 草稿
    1: 已作废
    2: 草稿
    3: 草稿
    4: 草稿
    6: 草稿
    8: 草稿
    30: 草稿
    31: 草稿

  币种:
    人民币元: 人民币

  税率字典 :
    0: ""
    17: "17%"
    13: "13%"
    16: "16%"
